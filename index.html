<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pattern Mind</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080815;
    --surface: #10102a;
    --surface2: #181840;
    --accent: #7b68ee;
    --gold: #ffd700;
    --text: #e0e0f0;
    --dim: #5a5a7a;
    --err: #ff4466;
    --ok: #44ffaa;
    --cell: clamp(52px, 16vw, 78px);
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  header {
    width: 100%; padding: 0.8rem 1rem 0.4rem;
    text-align: center;
    background: linear-gradient(180deg, #12123a 0%, transparent 100%);
  }
  header h1 {
    font-size: clamp(1.1rem, 4vw, 1.6rem);
    font-weight: 300; letter-spacing: 0.18em; text-transform: uppercase;
    background: linear-gradient(135deg, #7b68ee, #ff6ec7, #ffd700);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .sub-header {
    display: flex; justify-content: center; align-items: center;
    gap: 1.2rem; margin-top: 0.3rem; flex-wrap: wrap;
  }
  .sub-header span {
    font-size: clamp(0.7rem, 2.2vw, 0.82rem); color: var(--dim);
  }
  .sub-header .rule-hint {
    color: #a89bfe; font-style: italic;
  }

  /* ── Rule banner ── */
  #rule-banner {
    margin: 0.4rem 0.8rem; padding: 0.5rem 1rem;
    background: linear-gradient(135deg, rgba(123,104,238,0.1), rgba(255,110,199,0.08));
    border: 1px solid rgba(123,104,238,0.2); border-radius: 10px;
    text-align: center; font-size: clamp(0.72rem, 2.3vw, 0.85rem);
    color: #c0b8ff; line-height: 1.5; max-width: 540px;
  }

  /* ── Game layout ── */
  #game-wrap {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; padding: 0.5rem; gap: 0.8rem; width: 100%;
  }

  /* ── Grid ── */
  #grid {
    display: grid; gap: 5px; justify-content: center;
    padding: 10px; border-radius: 14px;
    background: rgba(123,104,238,0.04);
    border: 1px solid rgba(123,104,238,0.12);
  }
  .cell {
    width: var(--cell); height: var(--cell);
    border: 2px solid rgba(123,104,238,0.18);
    border-radius: 10px; background: var(--surface);
    cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s, transform 0.12s, box-shadow 0.25s;
  }
  .cell:active { transform: scale(0.92); }
  .cell.clue {
    background: var(--surface2); cursor: default;
    border-color: rgba(123,104,238,0.08);
  }
  .cell.clue::after {
    content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 4px; border-radius: 50%;
    background: rgba(123,104,238,0.35);
  }
  .cell.selected {
    border-color: var(--accent);
    box-shadow: 0 0 14px rgba(123,104,238,0.35);
  }
  .cell.wrong {
    border-color: var(--err);
    box-shadow: 0 0 10px rgba(255,68,102,0.25);
    animation: shake 0.35s;
  }
  .cell.right {
    border-color: var(--ok);
    box-shadow: 0 0 12px rgba(68,255,170,0.25);
  }
  .cell canvas { pointer-events: none; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  /* ── Palette ── */
  #palette-wrap {
    text-align: center; width: 100%; max-width: 520px;
  }
  #palette-wrap .label {
    font-size: 0.72rem; color: var(--dim);
    text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.3rem;
  }
  #palette {
    display: flex; flex-wrap: wrap; gap: 7px;
    justify-content: center; padding: 0.4rem;
  }
  .pal {
    width: clamp(42px, 11vw, 60px); height: clamp(42px, 11vw, 60px);
    border: 2px solid rgba(123,104,238,0.25); border-radius: 10px;
    background: var(--surface); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
  }
  .pal:active { transform: scale(0.9); }
  .pal.sel {
    border-color: var(--accent); transform: scale(1.08);
    box-shadow: 0 0 14px rgba(123,104,238,0.4);
  }
  .pal canvas { pointer-events: none; }

  /* ── Buttons ── */
  #controls { display: flex; gap: 0.5rem; padding: 0.5rem 0.8rem; flex-wrap: wrap; justify-content: center; }
  button {
    font-family: inherit; font-size: clamp(0.7rem, 2.3vw, 0.82rem);
    padding: 0.45rem 1rem; border: 1px solid rgba(123,104,238,0.35);
    border-radius: 8px; background: var(--surface); color: var(--text);
    cursor: pointer; text-transform: uppercase; letter-spacing: 0.06em;
    transition: background 0.2s, border-color 0.2s;
  }
  button:hover { background: rgba(123,104,238,0.12); border-color: var(--accent); }

  /* ── Overlay ── */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(8,8,21,0.94); z-index: 100;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 0.8rem; animation: fadeIn 0.35s; padding: 1.5rem;
  }
  .overlay.show { display: flex; }
  .overlay h2 {
    font-size: clamp(1.4rem, 5vw, 2.2rem); font-weight: 300;
    background: linear-gradient(135deg, #ffd700, #ff6ec7, #7b68ee);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .overlay p { color: var(--dim); text-align: center; max-width: 340px; line-height: 1.5; }
  .overlay canvas { border-radius: 14px; box-shadow: 0 0 50px rgba(123,104,238,0.25); }
  .overlay .stats { color: #a89bfe; font-size: 0.9rem; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ── Responsive ── */
  @media (max-width: 370px) { :root { --cell: 48px; } }
  @media (min-width: 768px) {
    :root { --cell: 74px; }
    #game-wrap { gap: 1rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Pattern Mind</h1>
  <div class="sub-header">
    <span>Level <span id="lvl-num">1</span></span>
    <span id="lvl-name"></span>
    <span class="rule-hint" id="rule-hint"></span>
  </div>
</header>

<div id="rule-banner"></div>

<div id="game-wrap">
  <div id="grid"></div>
  <div id="palette-wrap">
    <div class="label">Choose a shape</div>
    <div id="palette"></div>
  </div>
</div>

<div id="controls">
  <button id="btn-undo">Undo</button>
  <button id="btn-clear">Clear</button>
  <button id="btn-check">Check</button>
</div>

<div class="overlay" id="win-overlay">
  <h2>Brilliant!</h2>
  <p id="win-msg"></p>
  <canvas id="win-canvas"></canvas>
  <div class="stats" id="win-stats"></div>
  <button id="btn-next">Next Puzzle</button>
</div>

<div class="overlay" id="intro-overlay">
  <h2>Pattern Mind</h2>
  <p>Each puzzle hides a rule. Study the clue cells, discover the pattern, and fill in the blanks. No two identical shapes in any row or column.</p>
  <button id="btn-start">Begin</button>
</div>

<script>
// ══════════════════════════════════════════
//  DRAWING
// ══════════════════════════════════════════
const PALETTE_COLORS = [
  '#7b68ee','#ff6ec7','#00cec9','#ffd700',
  '#ff6b6b','#74b9ff','#55efc4','#fd79a8','#e17055','#a29bfe',
];
const SHAPE_NAMES = ['circle','triangle','square','pentagon','hexagon','star','diamond','ring'];

function drawShape(ctx, type, cx, cy, r, color, rot = 0) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.fillStyle = color;
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1.2;
  ctx.shadowColor = color;
  ctx.shadowBlur = 10;
  switch (type) {
    case 'circle':
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill(); ctx.stroke(); break;
    case 'triangle': poly(ctx,3,r); break;
    case 'square': poly(ctx,4,r); break;
    case 'pentagon': poly(ctx,5,r); break;
    case 'hexagon': poly(ctx,6,r); break;
    case 'star': starPath(ctx,5,r,r*0.42); break;
    case 'diamond': poly(ctx,4,r,0); break;
    case 'ring':
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
      ctx.arc(0,0,r*0.52,0,Math.PI*2,true); ctx.fill(); ctx.stroke(); break;
  }
  ctx.restore();
}
function poly(ctx,n,r,off=-Math.PI/2) {
  ctx.beginPath();
  for(let i=0;i<n;i++){const a=off+Math.PI*2*i/n;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
  ctx.closePath(); ctx.fill(); ctx.stroke();
}
function starPath(ctx,pts,outer,inner) {
  ctx.beginPath();
  for(let i=0;i<pts*2;i++){
    const r=i%2===0?outer:inner, a=-Math.PI/2+Math.PI*i/pts;
    ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
}

function renderShapeToCanvas(cvs, shapeIdx, size) {
  const dpr = devicePixelRatio;
  cvs.width = size * dpr; cvs.height = size * dpr;
  cvs.style.width = size + 'px'; cvs.style.height = size + 'px';
  const ctx = cvs.getContext('2d');
  ctx.scale(dpr, dpr);
  drawShape(ctx, SHAPE_NAMES[shapeIdx], size/2, size/2, size*0.36, PALETTE_COLORS[shapeIdx]);
}

// ══════════════════════════════════════════
//  PUZZLE GENERATION (Latin-square based)
// ══════════════════════════════════════════

// Generate a valid Latin square of size n using values 0..n-1
function latinSquare(n) {
  // Shuffled rows approach: start with shifted rows, then shuffle rows & columns
  const base = [];
  const rowPerm = shuffle([...Array(n).keys()]);
  const colPerm = shuffle([...Array(n).keys()]);
  const valPerm = shuffle([...Array(n).keys()]);
  for (let r = 0; r < n; r++) {
    base[r] = [];
    for (let c = 0; c < n; c++) {
      base[r][c] = valPerm[(rowPerm[r] + colPerm[c]) % n];
    }
  }
  return base;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Determine which cells to reveal as clues.
// We want enough clues that the puzzle is solvable by logical deduction,
// but few enough that it's challenging.
function pickClues(grid, n, difficulty) {
  // difficulty: 0 = easy (many clues), 1 = medium, 2 = hard
  const total = n * n;
  let targetClues;
  if (n === 3) targetClues = [6, 5, 4][difficulty] || 5;
  else if (n === 4) targetClues = [10, 8, 7][difficulty] || 8;
  else targetClues = [15, 12, 10][difficulty] || 12;

  // Start with all cells as clues, then try removing
  const isClue = Array.from({length: n}, () => Array(n).fill(true));
  const order = shuffle([...Array(total).keys()]);

  for (const idx of order) {
    const r = Math.floor(idx / n), c = idx % n;
    isClue[r][c] = false;
    if (!isSolvable(grid, isClue, n)) {
      isClue[r][c] = true; // put it back
    }
    const count = isClue.flat().filter(Boolean).length;
    if (count <= targetClues) break;
  }
  return isClue;
}

// Check if puzzle is uniquely solvable by constraint propagation
function isSolvable(solution, isClue, n) {
  // Try to solve using only logic (no guessing) — if we get unique solution, good
  const board = Array.from({length: n}, () => Array(n).fill(-1));
  const possible = Array.from({length: n}, () => Array.from({length: n}, () => new Set(
    [...Array(n).keys()]
  )));

  // Place clues
  for (let r = 0; r < n; r++)
    for (let c = 0; c < n; c++)
      if (isClue[r][c]) {
        if (!place(board, possible, n, r, c, solution[r][c])) return false;
      }

  // Iterative constraint propagation
  let changed = true;
  while (changed) {
    changed = false;
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        if (board[r][c] !== -1) continue;
        if (possible[r][c].size === 0) return false;
        if (possible[r][c].size === 1) {
          const val = [...possible[r][c]][0];
          if (!place(board, possible, n, r, c, val)) return false;
          changed = true;
          continue;
        }
        // Hidden singles: value that can only go in one place in row/col
        for (const val of possible[r][c]) {
          // Check row
          let rowCount = 0, rowPos = -1;
          for (let cc = 0; cc < n; cc++) {
            if (board[r][cc] === val) { rowCount = 2; break; }
            if (board[r][cc] === -1 && possible[r][cc].has(val)) { rowCount++; rowPos = cc; }
          }
          if (rowCount === 1 && rowPos === c) {
            if (!place(board, possible, n, r, c, val)) return false;
            changed = true; break;
          }
          // Check col
          let colCount = 0, colPos = -1;
          for (let rr = 0; rr < n; rr++) {
            if (board[rr][c] === val) { colCount = 2; break; }
            if (board[rr][c] === -1 && possible[rr][c].has(val)) { colCount++; colPos = rr; }
          }
          if (colCount === 1 && colPos === r) {
            if (!place(board, possible, n, r, c, val)) return false;
            changed = true; break;
          }
        }
      }
    }
  }

  // Check if fully solved
  for (let r = 0; r < n; r++)
    for (let c = 0; c < n; c++)
      if (board[r][c] === -1) return false;

  return true;
}

function place(board, possible, n, r, c, val) {
  board[r][c] = val;
  possible[r][c] = new Set([val]);
  // Eliminate from row and column
  for (let i = 0; i < n; i++) {
    if (i !== c) possible[r][i].delete(val);
    if (i !== r) possible[i][c].delete(val);
    if (i !== c && board[r][i] === -1 && possible[r][i].size === 0) return false;
    if (i !== r && board[i][c] === -1 && possible[i][c].size === 0) return false;
  }
  return true;
}

// ══════════════════════════════════════════
//  LEVEL DEFINITIONS
// ══════════════════════════════════════════
const LEVELS = [
  { n:3, diff:0, name:'First Steps',
    hint:'Each shape appears exactly once in every row and column.' },
  { n:3, diff:1, name:'Warming Up',
    hint:'Same rule — but fewer clues this time.' },
  { n:3, diff:2, name:'Sharp Eye',
    hint:'Can you still spot it with minimal clues?' },
  { n:4, diff:0, name:'Wider World',
    hint:'Four shapes now. Same Latin-square rule.' },
  { n:4, diff:1, name:'Hidden Order',
    hint:'Look for where a shape can only go in one spot.' },
  { n:4, diff:2, name:'Deep Logic',
    hint:'Use elimination across rows AND columns together.' },
  { n:5, diff:0, name:'Grand Canvas',
    hint:'Five shapes — the grid gets richer.' },
  { n:5, diff:1, name:'Enigma',
    hint:'Sometimes a column tells you more than a row.' },
  { n:5, diff:2, name:'Master Pattern',
    hint:'Only masters can solve this with so few clues.' },
  { n:5, diff:2, name:'Transcendence',
    hint:'You see the pattern in everything now.' },
];

// ══════════════════════════════════════════
//  GAME STATE
// ══════════════════════════════════════════
let lvl = 0;
let N = 3;
let solution = [];
let clueMap = [];
let board = [];      // -1 = empty, 0..n-1 = placed shape
let selectedCell = null;  // {r,c}
let selectedShape = null; // shape index
let history = [];    // undo stack: {r,c,prev}
let startTime = 0;
let moves = 0;

function startLevel(idx) {
  if (idx >= LEVELS.length) idx = LEVELS.length - 1;
  lvl = idx;
  const L = LEVELS[lvl];
  N = L.n;

  solution = latinSquare(N);
  clueMap = pickClues(solution, N, L.diff);

  board = Array.from({length:N}, () => Array(N).fill(-1));
  for (let r = 0; r < N; r++)
    for (let c = 0; c < N; c++)
      if (clueMap[r][c]) board[r][c] = solution[r][c];

  selectedCell = null;
  selectedShape = null;
  history = [];
  moves = 0;
  startTime = Date.now();

  document.getElementById('lvl-num').textContent = lvl + 1;
  document.getElementById('lvl-name').textContent = L.name;
  document.getElementById('rule-hint').textContent = '';
  document.getElementById('rule-banner').textContent = L.hint;
  document.getElementById('win-overlay').classList.remove('show');

  render();
}

// ══════════════════════════════════════════
//  RENDERING
// ══════════════════════════════════════════
function render() {
  renderGrid();
  renderPalette();
}

function renderGrid() {
  const g = document.getElementById('grid');
  g.innerHTML = '';
  g.style.gridTemplateColumns = `repeat(${N}, var(--cell))`;

  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (clueMap[r][c]) cell.classList.add('clue');
      if (selectedCell && selectedCell.r === r && selectedCell.c === c)
        cell.classList.add('selected');

      if (board[r][c] !== -1) {
        const cvs = document.createElement('canvas');
        const sz = 60;
        renderShapeToCanvas(cvs, board[r][c], sz);
        cvs.style.width = '80%'; cvs.style.height = '80%';
        cell.appendChild(cvs);
      }

      cell.addEventListener('click', () => onCellTap(r, c));
      g.appendChild(cell);
    }
  }
}

function renderPalette() {
  const p = document.getElementById('palette');
  p.innerHTML = '';
  for (let i = 0; i < N; i++) {
    const item = document.createElement('div');
    item.className = 'pal' + (selectedShape === i ? ' sel' : '');
    const cvs = document.createElement('canvas');
    renderShapeToCanvas(cvs, i, 46);
    cvs.style.width = '80%'; cvs.style.height = '80%';
    item.appendChild(cvs);
    item.addEventListener('click', () => onPaletteTap(i));
    p.appendChild(item);
  }
  // Eraser
  const eraser = document.createElement('div');
  eraser.className = 'pal' + (selectedShape === -2 ? ' sel' : '');
  eraser.innerHTML = '<span style="font-size:1.3rem;opacity:0.6">✕</span>';
  eraser.addEventListener('click', () => onPaletteTap(-2));
  p.appendChild(eraser);
}

// ══════════════════════════════════════════
//  INTERACTION
// ══════════════════════════════════════════
function onCellTap(r, c) {
  if (clueMap[r][c]) return; // can't modify clues

  if (selectedShape !== null) {
    // Place or erase
    const prev = board[r][c];
    if (selectedShape === -2) {
      board[r][c] = -1;
    } else {
      board[r][c] = selectedShape;
    }
    if (board[r][c] !== prev) {
      history.push({r, c, prev});
      moves++;
    }
    render();
    return;
  }

  // Select cell
  if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
    selectedCell = null;
  } else {
    selectedCell = {r, c};
  }
  render();
}

function onPaletteTap(shapeIdx) {
  if (selectedShape === shapeIdx) {
    selectedShape = null;
  } else {
    selectedShape = shapeIdx;
  }

  // If a cell is already selected, place immediately
  if (selectedCell && selectedShape !== null) {
    const {r, c} = selectedCell;
    if (!clueMap[r][c]) {
      const prev = board[r][c];
      board[r][c] = selectedShape === -2 ? -1 : selectedShape;
      if (board[r][c] !== prev) {
        history.push({r, c, prev});
        moves++;
      }
      selectedCell = null;
    }
  }

  render();
}

function undo() {
  if (!history.length) return;
  const {r, c, prev} = history.pop();
  board[r][c] = prev;
  render();
}

function clearBoard() {
  for (let r = 0; r < N; r++)
    for (let c = 0; c < N; c++)
      if (!clueMap[r][c]) board[r][c] = -1;
  history = [];
  render();
}

function check() {
  let allFilled = true;
  let allCorrect = true;
  const cells = document.querySelectorAll('.cell');

  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const idx = r * N + c;
      if (clueMap[r][c]) continue;
      if (board[r][c] === -1) {
        allFilled = false;
        continue;
      }
      if (board[r][c] === solution[r][c]) {
        cells[idx].classList.add('right');
      } else {
        cells[idx].classList.add('wrong');
        allCorrect = false;
      }
    }
  }

  if (allFilled && allCorrect) {
    setTimeout(showWin, 500);
  } else if (!allFilled) {
    document.getElementById('rule-hint').textContent = 'Fill all cells first!';
    setTimeout(() => document.getElementById('rule-hint').textContent = '', 2000);
  }

  // Clear markers after a moment
  setTimeout(() => {
    cells.forEach(c => { c.classList.remove('right','wrong'); });
  }, 1200);
}

function showWin() {
  const elapsed = Math.round((Date.now() - startTime) / 1000);
  const mins = Math.floor(elapsed / 60);
  const secs = elapsed % 60;

  document.getElementById('win-msg').textContent =
    `You discovered the hidden pattern in "${LEVELS[lvl].name}"!`;
  document.getElementById('win-stats').textContent =
    `${moves} moves · ${mins}m ${secs}s`;

  // Draw the solved grid beautifully
  const canvas = document.getElementById('win-canvas');
  const cellPx = Math.min(72, Math.floor((window.innerWidth - 80) / N));
  const pad = 18;
  const sz = N * cellPx + pad * 2;
  const dpr = devicePixelRatio;
  canvas.width = sz * dpr; canvas.height = sz * dpr;
  canvas.style.width = sz + 'px'; canvas.style.height = sz + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  // Radial bg
  const grad = ctx.createRadialGradient(sz/2, sz/2, 0, sz/2, sz/2, sz*0.7);
  grad.addColorStop(0, '#1a1a3e'); grad.addColorStop(1, '#080815');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, sz, sz);

  // Connection lines for matching neighbors — makes patterns visible
  ctx.strokeStyle = 'rgba(123,104,238,0.15)';
  ctx.lineWidth = 2;
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const x1 = pad + c * cellPx + cellPx/2;
      const y1 = pad + r * cellPx + cellPx/2;
      // right
      if (c < N-1) {
        ctx.beginPath(); ctx.moveTo(x1,y1);
        ctx.lineTo(pad+(c+1)*cellPx+cellPx/2, y1); ctx.stroke();
      }
      // down
      if (r < N-1) {
        ctx.beginPath(); ctx.moveTo(x1,y1);
        ctx.lineTo(x1, pad+(r+1)*cellPx+cellPx/2); ctx.stroke();
      }
    }
  }

  for (let r = 0; r < N; r++)
    for (let c = 0; c < N; c++) {
      const cx = pad + c * cellPx + cellPx/2;
      const cy = pad + r * cellPx + cellPx/2;
      drawShape(ctx, SHAPE_NAMES[solution[r][c]], cx, cy, cellPx*0.36, PALETTE_COLORS[solution[r][c]]);
    }

  document.getElementById('win-overlay').classList.add('show');
}

// ══════════════════════════════════════════
//  EVENTS
// ══════════════════════════════════════════
document.getElementById('btn-undo').addEventListener('click', undo);
document.getElementById('btn-clear').addEventListener('click', clearBoard);
document.getElementById('btn-check').addEventListener('click', check);
document.getElementById('btn-next').addEventListener('click', () => startLevel(lvl + 1));
document.getElementById('btn-start').addEventListener('click', () => {
  document.getElementById('intro-overlay').classList.remove('show');
  startLevel(0);
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  const num = parseInt(e.key);
  if (num >= 1 && num <= N) {
    onPaletteTap(num - 1);
  } else if (e.key === 'Backspace' || e.key === 'Delete') {
    onPaletteTap(-2);
  } else if (e.key === 'z' && (e.ctrlKey || e.metaKey)) {
    undo();
  }
});

// Init — show intro
document.getElementById('intro-overlay').classList.add('show');
</script>
</body>
