<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Shape Friends!</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1040;
    --card: #2a1860;
    --cell: clamp(70px, 22vw, 110px);
    --pal: clamp(58px, 18vw, 88px);
  }

  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Patrick Hand', cursive, sans-serif;
    background: var(--bg);
    min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }

  /* ── Animated starry background ── */
  #stars {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    overflow: hidden;
  }
  .twinkle {
    position: absolute; border-radius: 50%;
    background: white; animation: twinkle 2s ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: 0.15; transform: scale(0.8); }
    100% { opacity: 0.7; transform: scale(1.2); }
  }

  /* ── All content above stars ── */
  header, #game-wrap, #controls, .overlay { position: relative; z-index: 1; }

  /* ── Header ── */
  header {
    width: 100%; padding: 0.7rem 1rem 0.3rem; text-align: center;
  }
  header h1 {
    font-size: clamp(1.5rem, 6vw, 2.4rem);
    color: #fff;
    text-shadow: 0 0 20px rgba(255,200,50,0.5), 0 2px 0 rgba(0,0,0,0.3);
  }
  .level-badge {
    display: inline-block; margin-top: 0.2rem;
    padding: 0.15rem 0.7rem; border-radius: 20px;
    background: linear-gradient(135deg, #ff6ec7, #ffd700);
    color: #1a1040; font-size: clamp(0.75rem, 2.5vw, 0.95rem);
    font-weight: bold;
  }
  #prompt {
    margin-top: 0.4rem;
    font-size: clamp(0.9rem, 3.2vw, 1.15rem);
    color: #ffe066; text-shadow: 0 1px 4px rgba(0,0,0,0.4);
    line-height: 1.4;
  }

  /* ── Game area ── */
  #game-wrap {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; padding: 0.5rem; gap: 0.9rem;
    width: 100%;
  }

  /* ── Grid ── */
  #grid {
    display: grid; gap: 8px; justify-content: center;
    padding: 14px; border-radius: 20px;
    background: rgba(255,255,255,0.06);
    border: 3px solid rgba(255,255,255,0.1);
    box-shadow: 0 0 30px rgba(123,100,255,0.15);
  }
  .cell {
    width: var(--cell); height: var(--cell);
    border: 3px solid rgba(255,255,255,0.15);
    border-radius: 16px; background: var(--card);
    cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, border-color 0.25s, box-shadow 0.25s;
    font-size: clamp(2rem, 8vw, 3.5rem);
    user-select: none;
  }
  .cell:active { transform: scale(0.9); }
  .cell.clue {
    background: rgba(255,255,255,0.08);
    cursor: default;
  }
  .cell.empty-slot {
    border: 3px dashed rgba(255,220,100,0.4);
    background: rgba(255,220,100,0.06);
    animation: pulse 1.8s ease-in-out infinite;
  }
  .cell.selected {
    border-color: #ffe066;
    box-shadow: 0 0 20px rgba(255,224,102,0.4);
  }
  .cell.wrong {
    animation: wobble 0.5s;
    border-color: #ff6b6b;
  }
  .cell.right {
    animation: pop 0.4s;
    border-color: #55efc4;
    box-shadow: 0 0 18px rgba(85,239,196,0.4);
  }

  @keyframes pulse {
    0%,100% { box-shadow: 0 0 8px rgba(255,220,100,0.15); }
    50% { box-shadow: 0 0 22px rgba(255,220,100,0.35); }
  }
  @keyframes wobble {
    0%,100% { transform: rotate(0); }
    20% { transform: rotate(-8deg) scale(1.05); }
    40% { transform: rotate(8deg) scale(1.05); }
    60% { transform: rotate(-5deg); }
    80% { transform: rotate(5deg); }
  }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }

  /* ── Palette ── */
  #pal-wrap {
    text-align: center; width: 100%; max-width: 450px;
  }
  #pal-label {
    font-size: clamp(0.8rem, 2.8vw, 1rem);
    color: #c8b8ff; margin-bottom: 0.3rem;
  }
  #palette {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; padding: 0.4rem;
  }
  .pal {
    width: var(--pal); height: var(--pal);
    border: 3px solid rgba(255,255,255,0.18);
    border-radius: 16px; background: var(--card);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: clamp(1.8rem, 7vw, 3rem);
    transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
    user-select: none;
  }
  .pal:active { transform: scale(0.88); }
  .pal.sel {
    border-color: #ffe066; transform: scale(1.12);
    box-shadow: 0 0 20px rgba(255,224,102,0.45);
  }

  /* ── Stars counter ── */
  #star-bar {
    display: flex; gap: 0.3rem; justify-content: center;
    font-size: clamp(1.2rem, 4vw, 1.6rem);
    margin: 0.2rem 0;
    filter: drop-shadow(0 0 4px rgba(255,215,0,0.5));
  }

  /* ── Buttons ── */
  #controls {
    display: flex; gap: 0.6rem; padding: 0.5rem; flex-wrap: wrap; justify-content: center;
  }
  button {
    font-family: inherit;
    font-size: clamp(0.85rem, 3vw, 1rem);
    padding: 0.5rem 1.2rem;
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 14px;
    background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    color: white; cursor: pointer;
    font-weight: bold;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    box-shadow: 0 4px 12px rgba(108,92,231,0.3);
    transition: transform 0.15s, box-shadow 0.2s;
  }
  button:active { transform: scale(0.93); }
  button:hover { box-shadow: 0 4px 20px rgba(108,92,231,0.5); }
  button.green {
    background: linear-gradient(135deg, #00b894, #55efc4);
    box-shadow: 0 4px 12px rgba(0,184,148,0.3);
  }
  button.green:hover { box-shadow: 0 4px 20px rgba(0,184,148,0.5); }
  button.pink {
    background: linear-gradient(135deg, #e84393, #fd79a8);
    box-shadow: 0 4px 12px rgba(232,67,147,0.3);
  }

  /* ── Overlays ── */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(20,10,50,0.95); z-index: 100;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 0.7rem; padding: 1.5rem;
    animation: fadeIn 0.3s;
  }
  .overlay.show { display: flex; }
  .overlay h2 {
    font-size: clamp(1.8rem, 7vw, 3rem);
    color: #ffe066;
    text-shadow: 0 0 30px rgba(255,224,102,0.5), 0 3px 0 rgba(0,0,0,0.3);
  }
  .overlay p {
    color: #c8b8ff; text-align: center;
    font-size: clamp(0.95rem, 3.2vw, 1.15rem);
    max-width: 320px; line-height: 1.5;
  }
  .overlay .big-emoji {
    font-size: clamp(3rem, 12vw, 5rem);
    animation: bounce 0.8s ease-in-out infinite alternate;
  }
  @keyframes bounce {
    0% { transform: translateY(0) scale(1); }
    100% { transform: translateY(-12px) scale(1.05); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ── Confetti ── */
  .confetti {
    position: fixed; z-index: 200; pointer-events: none;
    width: 10px; height: 10px; border-radius: 2px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
  }
</style>
</head>
<body>

<div id="stars"></div>

<header>
  <h1>Shape Friends!</h1>
  <div class="level-badge" id="level-badge">Level 1</div>
  <div id="star-bar"></div>
  <div id="prompt"></div>
</header>

<div id="game-wrap">
  <div id="grid"></div>
  <div id="pal-wrap">
    <div id="pal-label"></div>
    <div id="palette"></div>
  </div>
</div>

<div id="controls">
  <button class="pink" id="btn-clear">Start Over</button>
  <button class="green" id="btn-check">Check!</button>
</div>

<div class="overlay" id="intro">
  <div class="big-emoji">🌟</div>
  <h2>Shape Friends!</h2>
  <p>Help the shapes find their home! Each row needs one of every shape. Can you figure out which ones are missing?</p>
  <button class="green" id="btn-play" style="font-size:1.2rem;padding:0.7rem 2rem;">Let's Play!</button>
</div>

<div class="overlay" id="win-screen">
  <div class="big-emoji" id="win-emoji">🎉</div>
  <h2 id="win-title">Yay!</h2>
  <p id="win-msg"></p>
  <div id="win-stars" style="font-size:2.5rem;"></div>
  <button class="green" id="btn-next" style="font-size:1.1rem;padding:0.6rem 1.8rem;">Next Puzzle!</button>
</div>

<script>
// ══════════════════════════════════════
//  SHAPE SETS (emoji-based for kids)
// ══════════════════════════════════════
const THEMES = [
  { name: 'Animals',   icons: ['🐱','🐶','🐰','🦊','🐸'] },
  { name: 'Space',     icons: ['🌟','🌙','🪐','🚀','☀️'] },
  { name: 'Fruits',    icons: ['🍎','🍌','🍇','🍊','🍓'] },
  { name: 'Ocean',     icons: ['🐙','🐠','🦀','🐚','🐳'] },
  { name: 'Garden',    icons: ['🌸','🌻','🌺','🍀','🌈'] },
  { name: 'Sweet',     icons: ['🍪','🧁','🍩','🍭','🎂'] },
  { name: 'Bugs',      icons: ['🐛','🦋','🐞','🐝','🐌'] },
  { name: 'Weather',   icons: ['☀️','🌧️','⛅','🌈','❄️'] },
];

// ══════════════════════════════════════
//  LEVELS — carefully tuned for 4-5yr
// ══════════════════════════════════════
// gridSize, blanks count (approximate), rule description for parents
const LEVEL_DEFS = [
  { n:2, maxBlanks:1, theme:0,
    prompt:"One friend is missing! Who goes in the empty spot?" },
  { n:2, maxBlanks:2, theme:1,
    prompt:"Two spots are empty! Each row needs both shapes." },
  { n:3, maxBlanks:2, theme:2,
    prompt:"Each row has 3 different fruits. Find the missing ones!" },
  { n:3, maxBlanks:3, theme:3,
    prompt:"The ocean friends need your help! One per row." },
  { n:3, maxBlanks:4, theme:4,
    prompt:"The garden is mixed up! Each row AND column needs all 3." },
  { n:3, maxBlanks:5, theme:5,
    prompt:"Sweet puzzle! Remember — no repeats in rows or columns!" },
  { n:4, maxBlanks:4, theme:6,
    prompt:"Bigger grid! 4 bugs — one of each per row." },
  { n:4, maxBlanks:6, theme:7,
    prompt:"Weather patterns! Each row and column needs all 4." },
  { n:4, maxBlanks:8, theme:0,
    prompt:"The animals are hiding! Use the clues to find them." },
  { n:4, maxBlanks:10, theme:1,
    prompt:"Space master! Can you solve this tricky one?" },
];

// ══════════════════════════════════════
//  LATIN SQUARE GENERATOR
// ══════════════════════════════════════
function shuffle(a) {
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function latinSquare(n) {
  const rp = shuffle([...Array(n).keys()]);
  const cp = shuffle([...Array(n).keys()]);
  const vp = shuffle([...Array(n).keys()]);
  return Array.from({length:n}, (_,r) =>
    Array.from({length:n}, (_,c) => vp[(rp[r]+cp[c]) % n])
  );
}

// Check solvability via constraint propagation
function canSolve(sol, clueMap, n) {
  const board = Array.from({length:n}, () => Array(n).fill(-1));
  const poss = Array.from({length:n}, () =>
    Array.from({length:n}, () => new Set([...Array(n).keys()]))
  );

  function put(r,c,v) {
    board[r][c] = v;
    poss[r][c] = new Set([v]);
    for (let i = 0; i < n; i++) {
      if (i !== c) { poss[r][i].delete(v); if (board[r][i]===-1 && !poss[r][i].size) return false; }
      if (i !== r) { poss[i][c].delete(v); if (board[i][c]===-1 && !poss[i][c].size) return false; }
    }
    return true;
  }

  for (let r=0;r<n;r++)
    for (let c=0;c<n;c++)
      if (clueMap[r][c]) if (!put(r,c,sol[r][c])) return false;

  let changed = true;
  while (changed) {
    changed = false;
    for (let r=0;r<n;r++) for (let c=0;c<n;c++) {
      if (board[r][c] !== -1) continue;
      if (!poss[r][c].size) return false;
      if (poss[r][c].size === 1) {
        if (!put(r,c,[...poss[r][c]][0])) return false;
        changed = true; continue;
      }
      for (const v of poss[r][c]) {
        let rowOnly = true, colOnly = true;
        for (let i=0;i<n;i++) {
          if (i!==c && board[r][i]===-1 && poss[r][i].has(v)) rowOnly = false;
          if (i!==r && board[i][c]===-1 && poss[i][c].has(v)) colOnly = false;
        }
        if (rowOnly || colOnly) {
          if (!put(r,c,v)) return false;
          changed = true; break;
        }
      }
    }
  }
  for (let r=0;r<n;r++) for (let c=0;c<n;c++) if (board[r][c]===-1) return false;
  return true;
}

function generatePuzzle(n, maxBlanks) {
  for (let attempt = 0; attempt < 50; attempt++) {
    const sol = latinSquare(n);
    const clue = Array.from({length:n}, () => Array(n).fill(true));
    const order = shuffle([...Array(n*n).keys()]);
    let blanks = 0;

    for (const idx of order) {
      if (blanks >= maxBlanks) break;
      const r = Math.floor(idx/n), c = idx % n;
      clue[r][c] = false;
      if (canSolve(sol, clue, n)) {
        blanks++;
      } else {
        clue[r][c] = true;
      }
    }
    if (blanks >= Math.max(1, maxBlanks - 1)) return { sol, clue };
  }
  // Fallback: simple puzzle with 1 blank
  const sol = latinSquare(n);
  const clue = Array.from({length:n}, () => Array(n).fill(true));
  const r = Math.floor(Math.random()*n), c = Math.floor(Math.random()*n);
  clue[r][c] = false;
  return { sol, clue };
}

// ══════════════════════════════════════
//  GAME STATE
// ══════════════════════════════════════
let lvl = 0;
let N, sol, clueMap, board, icons;
let selShape = null;
let totalStars = 0;
let attempts = 0;

function loadLevel(idx) {
  if (idx >= LEVEL_DEFS.length) idx = idx % LEVEL_DEFS.length;
  lvl = idx;
  const L = LEVEL_DEFS[lvl];
  N = L.n;
  icons = THEMES[L.theme].icons.slice(0, N);
  attempts = 0;

  const puzzle = generatePuzzle(N, L.maxBlanks);
  sol = puzzle.sol;
  clueMap = puzzle.clue;
  board = Array.from({length:N}, (_, r) =>
    Array.from({length:N}, (_, c) => clueMap[r][c] ? sol[r][c] : -1)
  );
  selShape = null;

  document.getElementById('level-badge').textContent =
    `Level ${lvl+1} — ${THEMES[L.theme].name}`;
  document.getElementById('prompt').textContent = L.prompt;
  document.getElementById('win-screen').classList.remove('show');
  renderStars();
  render();
}

// ══════════════════════════════════════
//  RENDER
// ══════════════════════════════════════
function render() {
  renderGrid();
  renderPalette();
}

function renderGrid() {
  const g = document.getElementById('grid');
  g.innerHTML = '';
  g.style.gridTemplateColumns = `repeat(${N}, var(--cell))`;

  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (clueMap[r][c]) {
        cell.classList.add('clue');
      } else if (board[r][c] === -1) {
        cell.classList.add('empty-slot');
      }
      if (board[r][c] !== -1) {
        cell.textContent = icons[board[r][c]];
      }
      cell.addEventListener('click', () => tapCell(r, c));
      g.appendChild(cell);
    }
  }
}

function renderPalette() {
  const p = document.getElementById('palette');
  p.innerHTML = '';
  const label = document.getElementById('pal-label');
  label.textContent = selShape !== null
    ? `Tap an empty spot to place ${icons[selShape]}`
    : 'Tap a shape, then tap where it goes!';

  for (let i = 0; i < N; i++) {
    const item = document.createElement('div');
    item.className = 'pal' + (selShape === i ? ' sel' : '');
    item.textContent = icons[i];
    item.addEventListener('click', () => tapPal(i));
    p.appendChild(item);
  }
}

function renderStars() {
  const bar = document.getElementById('star-bar');
  let s = '';
  for (let i = 0; i < totalStars && i < 30; i++) s += '⭐';
  bar.textContent = s || '';
}

// ══════════════════════════════════════
//  INTERACTION
// ══════════════════════════════════════
function tapPal(i) {
  selShape = selShape === i ? null : i;
  render();
}

function tapCell(r, c) {
  if (clueMap[r][c]) return;

  if (selShape !== null) {
    board[r][c] = selShape;
    render();
    // Auto-check if board is full
    if (isFull()) setTimeout(doCheck, 350);
  } else if (board[r][c] !== -1) {
    // Tap a placed shape to remove it
    board[r][c] = -1;
    render();
  }
}

function isFull() {
  for (let r=0;r<N;r++) for (let c=0;c<N;c++) if (board[r][c]===-1) return false;
  return true;
}

function doCheck() {
  attempts++;
  let allRight = true;
  const cells = document.querySelectorAll('.cell');

  for (let r=0;r<N;r++) for (let c=0;c<N;c++) {
    if (clueMap[r][c]) continue;
    const idx = r*N+c;
    if (board[r][c] === sol[r][c]) {
      cells[idx].classList.add('right');
    } else {
      cells[idx].classList.add('wrong');
      allRight = false;
    }
  }

  if (allRight) {
    const stars = attempts === 1 ? 3 : attempts === 2 ? 2 : 1;
    totalStars += stars;
    setTimeout(() => showWin(stars), 600);
  } else {
    document.getElementById('prompt').textContent = "Almost! Try again — you can do it! 💪";
    setTimeout(() => {
      cells.forEach(c => c.classList.remove('right','wrong'));
      document.getElementById('prompt').textContent = LEVEL_DEFS[lvl].prompt;
    }, 1400);
  }
}

function clearBoard() {
  for (let r=0;r<N;r++) for (let c=0;c<N;c++)
    if (!clueMap[r][c]) board[r][c] = -1;
  selShape = null;
  render();
}

// ══════════════════════════════════════
//  WIN CELEBRATION
// ══════════════════════════════════════
const WIN_EMOJIS = ['🎉','🥳','🌟','🎊','💖','🦄','✨','🏆'];
const WIN_TITLES = [
  'Amazing!','Yay!','You did it!','Super star!',
  'Brilliant!','Wow!','Fantastic!','Awesome!',
];
const WIN_MSGS = [
  'You figured out the pattern all by yourself!',
  'Those shapes are so happy in their new home!',
  'You\'re a real pattern detective!',
  'That was great thinking!',
  'The shapes are cheering for you!',
  'You\'re getting really good at this!',
];

function showWin(stars) {
  spawnConfetti();

  const emoji = WIN_EMOJIS[Math.floor(Math.random()*WIN_EMOJIS.length)];
  const title = WIN_TITLES[Math.floor(Math.random()*WIN_TITLES.length)];
  const msg = WIN_MSGS[Math.floor(Math.random()*WIN_MSGS.length)];

  document.getElementById('win-emoji').textContent = emoji;
  document.getElementById('win-title').textContent = title;
  document.getElementById('win-msg').textContent = msg;
  document.getElementById('win-stars').textContent = '⭐'.repeat(stars);
  document.getElementById('win-screen').classList.add('show');
  renderStars();
}

function spawnConfetti() {
  const colors = ['#ff6ec7','#ffd700','#7b68ee','#55efc4','#ff6b6b','#74b9ff','#fd79a8','#00cec9'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = -10 + 'px';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.width = (6 + Math.random()*8) + 'px';
    c.style.height = (6 + Math.random()*8) + 'px';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    c.style.animationDuration = (1.5 + Math.random()*2) + 's';
    c.style.animationDelay = Math.random() * 0.8 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

// ══════════════════════════════════════
//  STARRY BACKGROUND
// ══════════════════════════════════════
function makeStars() {
  const el = document.getElementById('stars');
  for (let i = 0; i < 50; i++) {
    const s = document.createElement('div');
    s.className = 'twinkle';
    const sz = 1 + Math.random() * 3;
    s.style.width = sz + 'px'; s.style.height = sz + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = Math.random() * 3 + 's';
    s.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    el.appendChild(s);
  }
}

// ══════════════════════════════════════
//  EVENTS
// ══════════════════════════════════════
document.getElementById('btn-play').addEventListener('click', () => {
  document.getElementById('intro').classList.remove('show');
  loadLevel(0);
});
document.getElementById('btn-clear').addEventListener('click', clearBoard);
document.getElementById('btn-check').addEventListener('click', () => {
  if (isFull()) doCheck();
  else {
    document.getElementById('prompt').textContent = 'Fill all the empty spots first! 🤔';
    setTimeout(() => document.getElementById('prompt').textContent = LEVEL_DEFS[lvl].prompt, 2000);
  }
});
document.getElementById('btn-next').addEventListener('click', () => loadLevel(lvl + 1));

// Init
makeStars();
document.getElementById('intro').classList.add('show');
</script>
</body>
</html>
