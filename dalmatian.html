<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dotty's Adventure!</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1030;overflow:hidden;touch-action:none;font-family:'Comic Sans MS','Chalkboard SE',cursive,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;width:100vw;user-select:none;-webkit-user-select:none}
canvas{display:block;image-rendering:pixelated;border-radius:8px}
#ui{position:fixed;top:0;left:0;width:100%;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;z-index:10;pointer-events:none}
#ui>div{pointer-events:auto}
.hud{font-size:clamp(0.8rem,3vw,1.1rem);color:#fff;text-shadow:0 2px 4px rgba(0,0,0,0.5);display:flex;gap:8px;align-items:center}
#touch-controls{position:fixed;bottom:0;left:0;width:100%;height:55%;z-index:10;pointer-events:auto;-webkit-tap-highlight-color:transparent}
#joystick-knob{position:absolute;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,0.4);background:rgba(255,255,255,0.12);display:none;transform:translate(-50%,-50%);pointer-events:none;backdrop-filter:blur(3px);box-shadow:0 0 15px rgba(255,255,255,0.1)}
#joystick-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.3);font-size:clamp(0.7rem,2.2vw,0.85rem);pointer-events:none;text-align:center;transition:opacity 0.5s}
#screen-title,#screen-win,#screen-over{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,10,40,0.92);gap:12px;padding:24px;text-align:center}
#screen-title h1{font-size:clamp(1.8rem,7vw,3rem);color:#ffe066;text-shadow:0 0 20px rgba(255,224,102,0.5)}
#screen-title p,#screen-win p,#screen-over p{color:#c8b8ff;font-size:clamp(0.9rem,3vw,1.1rem);max-width:360px;line-height:1.5}
#screen-win h2,#screen-over h2{font-size:clamp(1.5rem,6vw,2.5rem);color:#ffe066;text-shadow:0 0 20px rgba(255,224,102,0.4)}
.menu-btn{font-family:inherit;font-size:clamp(0.9rem,3.5vw,1.15rem);padding:12px 28px;border:none;border-radius:16px;cursor:pointer;font-weight:bold;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.3);box-shadow:0 4px 15px rgba(0,0,0,0.3)}
.btn-play{background:linear-gradient(135deg,#00b894,#55efc4)}
.btn-retry{background:linear-gradient(135deg,#6c5ce7,#a29bfe)}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="ui">
  <div class="hud"><span id="hud-hearts"></span></div>
  <div class="hud"><span id="hud-bones">🦴 0</span></div>
  <div class="hud"><span id="hud-phase"></span></div>
</div>
<canvas id="game"></canvas>
<div id="touch-controls">
  <div id="joystick-knob"></div>
  <div id="joystick-hint">Drag to run · Flick up to jump</div>
</div>
<div id="screen-title">
  <div style="font-size:clamp(3rem,12vw,5rem)">🐾</div>
  <h1>Dotty's Adventure!</h1>
  <p>Help Dotty the Dalmatian puppy explore magical worlds, collect bones, and make new friends!</p>
  <button class="menu-btn btn-play" id="btn-start">Let's Go!</button>
</div>
<div id="screen-win" class="hidden">
  <div style="font-size:3rem">🎉</div>
  <h2 id="win-title">Yay!</h2>
  <p id="win-msg"></p>
  <button class="menu-btn btn-play" id="btn-next-phase">Next World!</button>
</div>
<div id="screen-over" class="hidden">
  <div style="font-size:3rem">💖</div>
  <h2>Oh no!</h2>
  <p>Dotty needs a rest. Let's try again!</p>
  <button class="menu-btn btn-retry" id="btn-retry">Try Again!</button>
</div>

<script>
// ═══════════════════════════════════════════
//  CONSTANTS & CANVAS SETUP
// ═══════════════════════════════════════════
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const W = 480, H = 320;
cvs.width = W; cvs.height = H;

function resizeCanvas() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H, 3);
  cvs.style.width = (W * s) + 'px';
  cvs.style.height = (H * s) + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const TILE = 32;
const GRAVITY = 0.55;
const MAX_FALL = 9;

// ═══════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════
const keys = { left: false, right: false, jump: false };

document.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') keys.jump = true;
});
document.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') keys.jump = false;
});

// ═══════════════════════════════════════════
//  TOUCH — Finger-follow with flick-to-jump
// ═══════════════════════════════════════════
// Drag finger in any direction → Dotty follows.
//   Speed = how fast your finger moves horizontally.
// Flick upward → Dotty jumps.
//   Jump height = upward flick speed.
const joyKnob = document.getElementById('joystick-knob');
const joyHint = document.getElementById('joystick-hint');
const touchArea = document.getElementById('touch-controls');

let touchId = null;
let touchActive = false;
let touchPrev = null;      // previous frame's touch position
let touchVelX = 0;         // smoothed horizontal finger velocity (px/frame)
let touchVelY = 0;         // smoothed vertical finger velocity (px/frame)
let touchMoveX = 0;        // -1 to 1 analog horizontal
let touchJumpPower = 0;    // 0 to 1 — set on flick, consumed on jump
let flickCooldown = 0;     // frames until next flick allowed

const VEL_SMOOTH = 0.35;   // smoothing factor (lower = smoother)
const MOVE_THRESHOLD = 1.5; // px/frame finger speed to start moving
const FULL_SPEED_VEL = 12;  // px/frame finger speed for max run speed
const FLICK_THRESHOLD = 8;  // px/frame upward speed to trigger jump
const FLICK_MAX = 25;       // px/frame upward speed for max jump

touchArea.addEventListener('touchstart', e => {
  if (gameState !== 'playing' && gameState !== 'boss') return;
  e.preventDefault();
  e.stopPropagation();
  const t = e.changedTouches[0];
  touchId = t.identifier;
  touchActive = true;
  touchPrev = { x: t.clientX, y: t.clientY };
  touchVelX = 0;
  touchVelY = 0;
  joyKnob.style.display = 'block';
  joyKnob.style.left = t.clientX + 'px';
  joyKnob.style.top = t.clientY + 'px';
  joyHint.style.opacity = '0';
}, { passive: false });

touchArea.addEventListener('touchmove', e => {
  e.preventDefault();
  e.stopPropagation();
  for (const t of e.changedTouches) {
    if (t.identifier !== touchId) continue;
    const cx = t.clientX, cy = t.clientY;

    if (touchPrev) {
      const rawVx = cx - touchPrev.x;
      const rawVy = cy - touchPrev.y;
      // Exponential smoothing
      touchVelX = touchVelX * (1 - VEL_SMOOTH) + rawVx * VEL_SMOOTH;
      touchVelY = touchVelY * (1 - VEL_SMOOTH) + rawVy * VEL_SMOOTH;
    }
    touchPrev = { x: cx, y: cy };

    // Move knob indicator to finger
    joyKnob.style.left = cx + 'px';
    joyKnob.style.top = cy + 'px';
  }
}, { passive: false });

function endTouch(e) {
  for (const t of e.changedTouches) {
    if (t.identifier !== touchId) continue;
    touchId = null;
    touchActive = false;
    touchPrev = null;
    touchVelX = 0;
    touchVelY = 0;
    touchMoveX = 0;
    keys.left = false;
    keys.right = false;
    joyKnob.style.display = 'none';
    joyHint.style.opacity = '1';
  }
}
touchArea.addEventListener('touchend', endTouch);
touchArea.addEventListener('touchcancel', endTouch);

// Called every frame from update()
function processTouchInput() {
  if (flickCooldown > 0) flickCooldown--;

  if (!touchActive) {
    touchMoveX = 0;
    // Don't clear touchJumpPower here — it persists until consumed by jump
    return;
  }

  // Horizontal: finger velocity → movement direction & speed
  if (Math.abs(touchVelX) > MOVE_THRESHOLD) {
    touchMoveX = Math.max(-1, Math.min(1, touchVelX / FULL_SPEED_VEL));
  } else {
    // Below threshold: keep last direction but decelerate
    touchMoveX *= 0.85;
    if (Math.abs(touchMoveX) < 0.05) touchMoveX = 0;
  }

  keys.left = touchMoveX < -0.05;
  keys.right = touchMoveX > 0.05;

  // Vertical: upward flick speed → jump trigger
  // touchVelY is negative when swiping up
  if (-touchVelY > FLICK_THRESHOLD && flickCooldown <= 0) {
    const upSpeed = -touchVelY;
    touchJumpPower = Math.min(1, (upSpeed - FLICK_THRESHOLD) / (FLICK_MAX - FLICK_THRESHOLD));
    keys.jump = true;
    flickCooldown = 12; // prevent repeated jumps from same gesture
  } else if (flickCooldown <= 0) {
    keys.jump = false;
  }
}

// ═══════════════════════════════════════════
//  DRAWING HELPERS
// ═══════════════════════════════════════════
function drawDalmatian(x, y, dir, frame, isHurt, vx, vy, grounded) {
  ctx.save();
  // y = feet position from physics, shift drawing up so paws align with feet
  ctx.translate(x, y - 14);
  if (dir < 0) { ctx.scale(-1, 1); }

  if (isHurt && Math.floor(frame * 0.5) % 2 === 0) { ctx.globalAlpha = 0.4; }

  // Determine animation state
  const isRunning = grounded && Math.abs(vx) > 0.5;
  const isJumping = !grounded && vy < -1;
  const isFalling = !grounded && vy >= -1;
  const isIdle = grounded && Math.abs(vx) <= 0.5;

  // Body tilt based on state
  let bodyTilt = 0;
  let bodyBounce = 0;
  let bodyStretch = 1;  // vertical stretch
  let bodySqueeze = 1;  // horizontal squeeze

  if (isRunning) {
    // Running: fast rhythmic bounce, slight forward lean
    bodyBounce = Math.sin(frame * 0.6) * 3;
    bodyTilt = 0.08;
  } else if (isJumping) {
    // Jumping up: stretch vertically, tilt up
    bodyStretch = 1.15;
    bodySqueeze = 0.9;
    bodyTilt = -0.12;
    bodyBounce = -2;
  } else if (isFalling) {
    // Falling: squash, legs spread
    bodyStretch = 0.88;
    bodySqueeze = 1.1;
    bodyBounce = 1;
  } else {
    // Idle: gentle breathing
    bodyBounce = Math.sin(frame * 0.08) * 1.5;
  }

  // Apply body tilt
  ctx.rotate(bodyTilt);

  // Shadow (smaller when in air)
  const shadowScale = grounded ? 1 : 0.5;
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.beginPath(); ctx.ellipse(0, 14, 10 * shadowScale, 3 * shadowScale, 0, 0, Math.PI * 2); ctx.fill();

  // ── Legs (drawn behind body) ──
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#ccc';
  ctx.lineWidth = 0.8;

  if (isRunning) {
    // Running legs: alternating gallop cycle
    const cycle = frame * 0.55;
    const frontA = Math.sin(cycle) * 28;       // front leg angle in degrees
    const backA = Math.sin(cycle + Math.PI) * 28;
    const frontB = Math.sin(cycle + Math.PI * 0.5) * 22;
    const backB = Math.sin(cycle + Math.PI * 1.5) * 22;

    drawLeg(ctx, 6, bodyBounce + 5, frontA, 12);   // front right
    drawLeg(ctx, 1, bodyBounce + 5, frontB, 11);    // front left
    drawLeg(ctx, -7, bodyBounce + 5, backA, 12);    // back right
    drawLeg(ctx, -11, bodyBounce + 5, backB, 11);   // back left
  } else if (isJumping) {
    // Jumping: legs tucked up and back
    drawLeg(ctx, 6, bodyBounce + 3, -35, 10);
    drawLeg(ctx, 1, bodyBounce + 4, -25, 10);
    drawLeg(ctx, -7, bodyBounce + 4, 20, 11);
    drawLeg(ctx, -11, bodyBounce + 5, 30, 11);
  } else if (isFalling) {
    // Falling: legs spread out below
    drawLeg(ctx, 7, bodyBounce + 5, 15, 12);
    drawLeg(ctx, 1, bodyBounce + 5, 5, 12);
    drawLeg(ctx, -7, bodyBounce + 5, -5, 12);
    drawLeg(ctx, -12, bodyBounce + 5, -15, 12);
  } else {
    // Idle: standing straight with slight shift
    const idleShift = Math.sin(frame * 0.08) * 1;
    drawLeg(ctx, 6, bodyBounce + 5, idleShift, 11);
    drawLeg(ctx, 1, bodyBounce + 5, -idleShift * 0.5, 11);
    drawLeg(ctx, -7, bodyBounce + 5, idleShift * 0.5, 11);
    drawLeg(ctx, -11, bodyBounce + 5, -idleShift, 11);
  }

  // ── Body ──
  ctx.fillStyle = '#fff';
  ctx.save();
  ctx.scale(bodySqueeze, bodyStretch);
  ctx.beginPath();
  ctx.ellipse(0, bodyBounce / bodyStretch - 2, 12, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#ddd'; ctx.lineWidth = 0.5; ctx.stroke();
  ctx.restore();

  // Spots (move with body bounce)
  const b = bodyBounce;
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(-5, b - 5, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(4, b + 1, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(-2, b + 3, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(7, b - 4, 1.8, 0, Math.PI * 2); ctx.fill();

  // ── Head ──
  // Head bobs more when running, tilts on jump
  let headOff = b;
  let headTilt = 0;
  if (isRunning) { headOff = Math.sin(frame * 0.6 + 0.5) * 2.5; }
  if (isJumping) { headTilt = -0.15; headOff = -3; }
  if (isFalling) { headTilt = 0.1; headOff = 2; }

  ctx.save();
  ctx.translate(10, headOff - 10);
  ctx.rotate(headTilt);

  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#ddd'; ctx.lineWidth = 0.5; ctx.stroke();

  // Ear — flops when running/jumping
  let earFlop = 0;
  if (isRunning) earFlop = Math.sin(frame * 0.6) * 0.25;
  if (isJumping) earFlop = 0.4;
  if (isFalling) earFlop = -0.3;
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.ellipse(4, -7, 4, 6, 0.3 + earFlop, 0, Math.PI * 2);
  ctx.fill();

  // Eye — wider when jumping
  const eyeR = isJumping ? 2.5 : isFalling ? 2.3 : 2;
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(4, -1, eyeR, 0, Math.PI * 2); ctx.fill();
  // Eye shine
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(4.8, -1.8, 0.8, 0, Math.PI * 2); ctx.fill();

  // Nose
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.arc(8, 1, 1.5, 0, Math.PI * 2); ctx.fill();

  // Mouth — open when jumping, happy when running
  ctx.strokeStyle = '#555'; ctx.lineWidth = 0.8; ctx.lineCap = 'round';
  if (isJumping) {
    // Open mouth — excited!
    ctx.fillStyle = '#ff9999';
    ctx.beginPath(); ctx.ellipse(7, 4, 2.5, 2, 0, 0, Math.PI * 2); ctx.fill();
  } else if (isRunning) {
    // Big happy panting smile
    ctx.beginPath(); ctx.arc(6, 3, 3, 0, Math.PI * 0.8); ctx.stroke();
    // Tongue
    ctx.fillStyle = '#ff8888';
    ctx.beginPath(); ctx.ellipse(8, 5, 1.5, 2.5, 0.2, 0, Math.PI * 2); ctx.fill();
  } else {
    // Gentle smile
    ctx.beginPath(); ctx.arc(7, 3, 2, 0, Math.PI * 0.6); ctx.stroke();
  }

  ctx.restore(); // head transform

  // ── Tail ──
  let tailWag, tailCurve;
  if (isRunning) {
    // Wagging fast
    tailWag = Math.sin(frame * 0.7) * 8;
    tailCurve = -18;
  } else if (isJumping) {
    // Tail up and stiff
    tailWag = 2;
    tailCurve = -22;
  } else if (isFalling) {
    // Tail down
    tailWag = Math.sin(frame * 0.2) * 3;
    tailCurve = -8;
  } else {
    // Gentle wag
    tailWag = Math.sin(frame * 0.12) * 5;
    tailCurve = -15;
  }
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-12, b - 4);
  ctx.quadraticCurveTo(-20, tailCurve + tailWag + b, -16, tailCurve - 4 + b);
  ctx.stroke();
  // Tail tip white
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-17, tailCurve - 2 + b);
  ctx.lineTo(-16, tailCurve - 5 + b);
  ctx.stroke();

  ctx.restore();
}

// Helper: draw one jointed leg
function drawLeg(ctx, lx, ly, angleDeg, length) {
  const angle = angleDeg * Math.PI / 180;
  const kneeX = lx + Math.sin(angle) * length * 0.5;
  const kneeY = ly + Math.cos(angle) * length * 0.5;
  const pawX = lx + Math.sin(angle * 0.6) * length;
  const pawY = ly + Math.abs(Math.cos(angle)) * length;

  // Upper leg
  ctx.strokeStyle = '#eee'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(kneeX, kneeY); ctx.stroke();
  // Lower leg
  ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(kneeX, kneeY); ctx.lineTo(pawX, pawY); ctx.stroke();
  // Paw
  ctx.fillStyle = '#eee';
  ctx.beginPath(); ctx.arc(pawX, pawY, 2.5, 0, Math.PI * 2); ctx.fill();
}

function drawAxolotl(x, y, frame, hp, maxHp) {
  ctx.save();
  ctx.translate(x, y);
  const bob = Math.sin(frame * 0.05) * 3;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.beginPath(); ctx.ellipse(0, 20, 22, 5, 0, 0, Math.PI * 2); ctx.fill();

  // Body
  ctx.fillStyle = '#ffb3d9';
  ctx.beginPath(); ctx.ellipse(0, bob, 20, 14, 0, 0, Math.PI * 2); ctx.fill();

  // Tail
  ctx.fillStyle = '#ff99cc';
  ctx.beginPath();
  ctx.moveTo(-18, bob + 2);
  ctx.quadraticCurveTo(-35, bob - 8 + Math.sin(frame * 0.04) * 6, -40, bob + 5);
  ctx.quadraticCurveTo(-30, bob + 12, -18, bob + 6);
  ctx.fill();

  // Gills (frilly bits on head)
  const gillColor = '#ff80bf';
  for (let side = -1; side <= 1; side += 2) {
    for (let i = 0; i < 3; i++) {
      const angle = -0.8 + i * 0.4;
      const gx = side * 16;
      const gy = bob - 10 + i * 4;
      ctx.fillStyle = gillColor;
      ctx.beginPath();
      ctx.ellipse(gx + Math.cos(angle) * 8, gy + Math.sin(angle) * 3,
        7, 2.5, angle * side, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Face
  // Eyes
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(-7, bob - 5, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(7, bob - 5, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-6, bob - 6, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(8, bob - 6, 1.5, 0, Math.PI * 2); ctx.fill();

  // Smile
  ctx.strokeStyle = '#cc6699'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, bob - 1, 6, 0.15, Math.PI - 0.15); ctx.stroke();

  // Blush
  ctx.fillStyle = 'rgba(255,100,150,0.3)';
  ctx.beginPath(); ctx.ellipse(-12, bob, 4, 2.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(12, bob, 4, 2.5, 0, 0, Math.PI * 2); ctx.fill();

  // Little feet
  ctx.fillStyle = '#ffb3d9';
  ctx.beginPath(); ctx.ellipse(-10, bob + 14, 5, 3, -0.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(10, bob + 14, 5, 3, 0.2, 0, Math.PI * 2); ctx.fill();

  // HP bar
  if (hp < maxHp) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(-20, -28, 40, 6);
    ctx.fillStyle = '#55efc4';
    ctx.fillRect(-20, -28, 40 * (hp / maxHp), 6);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 0.5;
    ctx.strokeRect(-20, -28, 40, 6);
  }

  ctx.restore();
}

function drawBubble(x, y, r, frame) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(150,200,255,0.3)';
  ctx.strokeStyle = 'rgba(200,230,255,0.6)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // Shine
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.3, r * 0.25, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawBone(x, y, frame) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.sin(frame * 0.05) * 0.15);
  const bob = Math.sin(frame * 0.08) * 2;
  ctx.translate(0, bob);
  ctx.fillStyle = '#fff5e0';
  ctx.strokeStyle = '#ddc';
  ctx.lineWidth = 0.8;
  // Shaft
  ctx.fillRect(-8, -2.5, 16, 5);
  ctx.strokeRect(-8, -2.5, 16, 5);
  // Ends
  for (const sx of [-8, 8]) {
    ctx.beginPath(); ctx.arc(sx, -3.5, 3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(sx, 3.5, 3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  // Sparkle
  if (Math.sin(frame * 0.1) > 0.7) {
    ctx.fillStyle = '#ffd700';
    ctx.font = '8px sans-serif';
    ctx.fillText('✦', 6, -8);
  }
  ctx.restore();
}

function drawHeart(x, y, frame) {
  ctx.save();
  ctx.translate(x, y + Math.sin(frame * 0.06) * 2);
  ctx.scale(0.6, 0.6);
  ctx.fillStyle = '#ff6b81';
  ctx.beginPath();
  ctx.moveTo(0, 5);
  ctx.bezierCurveTo(-10, -5, -15, -12, -8, -16);
  ctx.bezierCurveTo(-2, -19, 0, -14, 0, -12);
  ctx.bezierCurveTo(0, -14, 2, -19, 8, -16);
  ctx.bezierCurveTo(15, -12, 10, -5, 0, 5);
  ctx.fill();
  ctx.restore();
}

function drawGem(x, y, frame) {
  ctx.save();
  ctx.translate(x, y + Math.sin(frame * 0.07) * 2);
  ctx.fillStyle = '#a29bfe';
  ctx.strokeStyle = '#6c5ce7';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, -8); ctx.lineTo(7, -2); ctx.lineTo(4, 8);
  ctx.lineTo(-4, 8); ctx.lineTo(-7, -2); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.moveTo(0, -8); ctx.lineTo(3, -2); ctx.lineTo(-3, -2); ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawButterfly(x, y, frame, color) {
  ctx.save();
  ctx.translate(x, y + Math.sin(frame * 0.06) * 4);
  const wingFlap = Math.sin(frame * 0.15) * 0.6;
  // Wings
  ctx.fillStyle = color || '#ffb3d9';
  ctx.save(); ctx.scale(1, Math.cos(wingFlap));
  ctx.beginPath(); ctx.ellipse(-6, -3, 7, 10, -0.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6, -3, 7, 10, 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // Body
  ctx.fillStyle = '#333';
  ctx.fillRect(-1, -6, 2, 12);
  // Antennae
  ctx.strokeStyle = '#333'; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(-4, -12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(4, -12); ctx.stroke();
  ctx.restore();
}

function drawCloud(x, y, scale) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath();
  ctx.arc(0, 0, 20, 0, Math.PI * 2);
  ctx.arc(18, -2, 15, 0, Math.PI * 2);
  ctx.arc(-16, 2, 14, 0, Math.PI * 2);
  ctx.arc(8, 8, 12, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawFlower(x, y, color) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = '#4a2'; ctx.fillRect(-1, 0, 2, 8);
  ctx.fillStyle = color;
  for (let i = 0; i < 5; i++) {
    const a = (Math.PI * 2 * i) / 5 - Math.PI / 2;
    ctx.beginPath(); ctx.arc(Math.cos(a) * 4, Math.sin(a) * 4, 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#ffd700';
  ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ═══════════════════════════════════════════
//  GAME ENGINE
// ═══════════════════════════════════════════
const PHASES = [makePhase1, makePhase2, makePhase3];
let phase = null;
let currentPhase = 0;

// Player state
let player = {};
function resetPlayer(px, py) {
  player = {
    x: px, y: py, vx: 0, vy: 0,
    w: 16, h: 24,
    dir: 1, grounded: false,
    hp: 5, maxHp: 5,
    bones: 0, gems: 0,
    hurtTimer: 0,
    frame: 0,
    jumpHeld: false,
    alive: true
  };
}

// Boss state
let boss = null;
function resetBoss() {
  boss = {
    active: false, defeated: false,
    x: 0, y: 0, hp: 5, maxHp: 5,
    phase: 'idle', // idle, fight, hurt, defeated
    timer: 0, moveDir: 1,
    bubbles: [],
    boopCount: 0,
    hurtFlash: 0
  };
}

// Camera
let cam = { x: 0, y: 0 };

let gameState = 'title'; // title, playing, boss, win, over
let frameCt = 0;

function startPhase(idx) {
  currentPhase = idx;
  phase = PHASES[Math.min(idx, PHASES.length - 1)]();
  resetPlayer(phase.startX, phase.startY);
  resetBoss();
  gameState = 'playing';
  frameCt = 0;
  updateHUD();
  document.getElementById('screen-title').classList.add('hidden');
  document.getElementById('screen-win').classList.add('hidden');
  document.getElementById('screen-over').classList.add('hidden');
}

// ═══════════════════════════════════════════
//  COLLISION
// ═══════════════════════════════════════════
function tileAt(c, r) {
  if (r < 0 || r >= phase.rows || c < 0 || c >= phase.cols) return 0;
  return phase.map[r][c];
}

function isSolid(c, r) { return tileAt(c, r) === 1; }
function isPlatform(c, r) { return tileAt(c, r) === 2; }

function collideWorld(ent) {
  // Horizontal — only solid blocks stop you (not platforms)
  ent.x += ent.vx;
  const left = Math.floor((ent.x - ent.w/2) / TILE);
  const right = Math.floor((ent.x + ent.w/2 - 1) / TILE);
  const top = Math.floor((ent.y - ent.h) / TILE);
  const bot = Math.floor((ent.y - 1) / TILE);

  for (let r = top; r <= bot; r++) {
    if (isSolid(left, r) && ent.vx < 0) {
      ent.x = (left + 1) * TILE + ent.w/2;
      ent.vx = 0;
    }
    if (isSolid(right, r) && ent.vx > 0) {
      ent.x = right * TILE - ent.w/2;
      ent.vx = 0;
    }
  }

  // Remember feet Y before gravity move (for one-way platform check)
  const prevFeetY = ent.y;

  // Vertical
  ent.y += ent.vy;
  ent.grounded = false;
  const left2 = Math.floor((ent.x - ent.w/2 + 2) / TILE);
  const right2 = Math.floor((ent.x + ent.w/2 - 3) / TILE);
  const top2 = Math.floor((ent.y - ent.h) / TILE);
  const bot2 = Math.floor(ent.y / TILE);

  for (let c = left2; c <= right2; c++) {
    // Solid blocks: collide from all sides
    if (isSolid(c, top2) && ent.vy < 0) {
      ent.y = (top2 + 1) * TILE + ent.h;
      ent.vy = 0;
    }
    if (isSolid(c, bot2) && ent.vy > 0) {
      ent.y = bot2 * TILE;
      ent.vy = 0;
      ent.grounded = true;
    }
    // One-way platforms: land on top only when falling and feet were
    // at or above the platform top edge before this frame's movement
    const platTop = bot2 * TILE;
    if (isPlatform(c, bot2) && ent.vy > 0 && prevFeetY <= platTop) {
      ent.y = platTop;
      ent.vy = 0;
      ent.grounded = true;
    }
  }

  // Fall out of world
  if (ent.y > phase.rows * TILE + 64) {
    ent.hp -= 1;
    if (ent.hp <= 0) { ent.alive = false; return; }
    ent.x = phase.startX; ent.y = phase.startY;
    ent.vx = 0; ent.vy = 0;
  }
}

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

// ═══════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════
function update() {
  if (gameState !== 'playing' && gameState !== 'boss') return;
  frameCt++;
  player.frame = frameCt;

  // Process touch joystick into keys + analog values
  processTouchInput();

  // Movement — analog speed from touch, full speed from keyboard
  const MAX_SPEED = 3.4;
  const MIN_SPEED = 0.8;
  if (keys.left) {
    const analog = touchActive ? Math.abs(touchMoveX) : 1;
    const speed = MIN_SPEED + (MAX_SPEED - MIN_SPEED) * Math.min(1, analog);
    player.vx = -speed;
    player.dir = -1;
  } else if (keys.right) {
    const analog = touchActive ? Math.abs(touchMoveX) : 1;
    const speed = MIN_SPEED + (MAX_SPEED - MIN_SPEED) * Math.min(1, analog);
    player.vx = speed;
    player.dir = 1;
  } else {
    player.vx *= 0.75;
    if (Math.abs(player.vx) < 0.15) player.vx = 0;
  }

  // Jump — analog height from flick speed (touch) or full from keyboard
  const MIN_JUMP = -7;
  const MAX_JUMP = -13;
  if (keys.jump && player.grounded && !player.jumpHeld) {
    const analog = touchActive ? Math.max(0.3, touchJumpPower) : 1;
    player.vy = MIN_JUMP + (MAX_JUMP - MIN_JUMP) * analog;
    player.grounded = false;
    player.jumpHeld = true;
    touchJumpPower = 0; // consume the flick
  }
  if (!keys.jump) player.jumpHeld = false;

  // Gravity
  player.vy += GRAVITY;
  if (player.vy > MAX_FALL) player.vy = MAX_FALL;

  // Hurt timer
  if (player.hurtTimer > 0) player.hurtTimer--;

  // World collision
  collideWorld(player);

  if (!player.alive) {
    gameState = 'over';
    document.getElementById('screen-over').classList.remove('hidden');
    return;
  }

  // Collect items
  for (const item of phase.items) {
    if (item.collected) continue;
    const dist = Math.hypot(player.x - item.x, (player.y - player.h/2) - item.y);
    if (dist < 20) {
      item.collected = true;
      if (item.type === 'bone') player.bones++;
      if (item.type === 'heart') { player.hp = Math.min(player.hp + 1, player.maxHp); }
      if (item.type === 'gem') player.gems++;
    }
  }

  // Enemy movement & collision
  for (const e of phase.enemies) {
    if (e.dead) {
      if (e.deadTimer > 0) e.deadTimer--;
      continue;
    }
    if (!e.baseY) e.baseY = e.y; // store original Y on first frame
    e.x = e.startX + Math.sin(frameCt * 0.025 + e.startX * 0.1) * e.range;
    e.y = e.baseY + Math.sin(frameCt * 0.04 + e.startX * 0.05) * 12;
  }

  for (const e of phase.enemies) {
    if (e.dead || player.hurtTimer > 0) continue;
    const dx = Math.abs(player.x - e.x);
    const feetY = player.y;        // feet position
    const eCenterY = e.y;
    const dy = Math.abs(feetY - player.h/2 - eCenterY);
    if (dx < 20 && dy < 20) {
      // Stomp: player is falling and feet are above enemy center
      if (player.vy > 0 && feetY < eCenterY + 5) {
        e.dead = true;
        e.deadTimer = 30;
        player.vy = -8; // bounce up
        player.bones++;
      } else {
        // Hurt player
        player.hp--;
        player.hurtTimer = 60;
        player.vy = -5;
        player.vx = player.x < e.x ? -3 : 3;
        if (player.hp <= 0) { player.alive = false; }
      }
    }
  }

  // Boss zone check
  if (gameState === 'playing' && !boss.defeated) {
    const playerCol = Math.floor(player.x / TILE);
    if (playerCol >= phase.bossZone) {
      gameState = 'boss';
      boss.active = true;
      boss.x = (phase.bossZone + 3) * TILE;
      boss.y = 5 * TILE;
      boss.hp = 3 + currentPhase;
      boss.maxHp = boss.hp;
      boss.phase = 'fight';
    }
  }

  // Boss logic
  if (gameState === 'boss' && boss.active && !boss.defeated) {
    boss.timer++;

    // Boss movement
    boss.x += Math.sin(boss.timer * 0.02) * 1.2;
    boss.y = 4 * TILE + Math.sin(boss.timer * 0.03) * TILE;

    // Shoot bubbles periodically
    if (boss.timer % 90 === 0) {
      const angle = Math.atan2((player.y - player.h/2) - boss.y, player.x - boss.x);
      boss.bubbles.push({
        x: boss.x, y: boss.y,
        vx: Math.cos(angle) * 2,
        vy: Math.sin(angle) * 2,
        r: 8, life: 180
      });
    }

    // Update bubbles
    for (let i = boss.bubbles.length - 1; i >= 0; i--) {
      const b = boss.bubbles[i];
      b.x += b.vx; b.y += b.vy;
      b.life--;
      if (b.life <= 0) { boss.bubbles.splice(i, 1); continue; }

      // Bubble hits player
      if (player.hurtTimer <= 0) {
        const dx = player.x - b.x, dy = (player.y - player.h/2) - b.y;
        if (Math.hypot(dx, dy) < b.r + 10) {
          player.hp--;
          player.hurtTimer = 60;
          player.vy = -4;
          boss.bubbles.splice(i, 1);
          if (player.hp <= 0) player.alive = false;
        }
      }
    }

    // Player jumps on boss (boop!)
    if (player.vy > 0 && player.hurtTimer <= 0) {
      const dx = Math.abs(player.x - boss.x);
      const dy = (player.y) - (boss.y - 15);
      if (dx < 25 && dy > -5 && dy < 12) {
        boss.hp--;
        boss.hurtFlash = 20;
        player.vy = -8;
        boss.bubbles = [];
        if (boss.hp <= 0) {
          boss.defeated = true;
          boss.phase = 'defeated';
          setTimeout(() => {
            gameState = 'win';
            const titles = ["New Friend!", "You did it!", "Amazing!"];
            const msgs = [
              "The axolotl just wanted to play! Now it's Dotty's friend! 🩷",
              "The candy dragon shares its sweets with Dotty! 🍬",
              "The star owl lights up the forest for Dotty! ✨"
            ];
            document.getElementById('win-title').textContent = titles[Math.min(currentPhase, titles.length-1)];
            document.getElementById('win-msg').textContent = msgs[Math.min(currentPhase, msgs.length-1)];
            document.getElementById('screen-win').classList.remove('hidden');
          }, 1000);
        }
      }
    }

    if (boss.hurtFlash > 0) boss.hurtFlash--;
  }

  // Camera
  cam.x = player.x - W / 2;
  cam.y = player.y - H * 0.6;
  cam.x = Math.max(0, Math.min(cam.x, phase.cols * TILE - W));
  cam.y = Math.max(0, Math.min(cam.y, phase.rows * TILE - H));

  updateHUD();
}

function updateHUD() {
  let hearts = '';
  for (let i = 0; i < player.maxHp; i++) hearts += i < player.hp ? '💖' : '🤍';
  document.getElementById('hud-hearts').textContent = hearts;
  document.getElementById('hud-bones').textContent = '🦴 ' + player.bones;
  document.getElementById('hud-phase').textContent = phase ? phase.name : '';
}


// ═══════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════
function draw() {
  if (!phase) return;
  ctx.clearRect(0, 0, W, H);

  // Sky gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, phase.bgColor1);
  skyGrad.addColorStop(1, phase.bgColor2);
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(-cam.x, -cam.y);

  // Decorations (behind)
  for (const d of phase.decorations) {
    if (d.type === 'cloud') {
      const parallax = 0.3;
      drawCloud(d.x - cam.x * parallax, d.y, d.scale);
    }
    if (d.type === 'flower') {
      drawFlower(d.x, d.y, d.color);
    }
  }

  // Tiles
  const startCol = Math.max(0, Math.floor(cam.x / TILE) - 1);
  const endCol = Math.min(phase.cols, Math.ceil((cam.x + W) / TILE) + 1);
  const startRow = Math.max(0, Math.floor(cam.y / TILE) - 1);
  const endRow = Math.min(phase.rows, Math.ceil((cam.y + H) / TILE) + 1);

  for (let r = startRow; r < endRow; r++) {
    for (let c = startCol; c < endCol; c++) {
      const t = phase.map[r][c];
      if (t === 0) continue;
      const tx = c * TILE, ty = r * TILE;
      if (t === 1) {
        // Ground
        ctx.fillStyle = phase.groundColor;
        ctx.fillRect(tx, ty, TILE, TILE);
        // Top edge grass
        if (r === 0 || phase.map[r-1][c] === 0) {
          ctx.fillStyle = '#6abf4b';
          ctx.fillRect(tx, ty, TILE, 4);
          // Grass blades
          ctx.fillStyle = '#7dd35f';
          for (let g = 0; g < 4; g++) {
            const gx = tx + 4 + g * 7;
            ctx.fillRect(gx, ty - 3, 2, 5);
          }
        }
        // Texture
        ctx.fillStyle = phase.groundColor2;
        ctx.fillRect(tx + 2, ty + 12, 6, 4);
        ctx.fillRect(tx + 18, ty + 8, 8, 3);
      } else if (t === 2) {
        // Platform
        ctx.fillStyle = phase.platColor;
        ctx.fillRect(tx, ty, TILE, TILE / 2);
        ctx.fillStyle = phase.platColor2;
        ctx.fillRect(tx, ty + TILE / 2 - 4, TILE, 4);
        // Top highlight
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(tx, ty, TILE, 2);
      }
    }
  }

  // Items
  for (const item of phase.items) {
    if (item.collected) continue;
    if (item.x < cam.x - 40 || item.x > cam.x + W + 40) continue;
    if (item.type === 'bone') drawBone(item.x, item.y, frameCt);
    if (item.type === 'heart') drawHeart(item.x, item.y, frameCt);
    if (item.type === 'gem') drawGem(item.x, item.y, frameCt);
  }

  // Enemies
  for (const e of phase.enemies) {
    if (e.x < cam.x - 40 || e.x > cam.x + W + 40) continue;
    if (e.dead) {
      // Poof animation
      if (e.deadTimer > 0) {
        const t = 1 - e.deadTimer / 30;
        ctx.globalAlpha = 1 - t;
        ctx.fillStyle = '#fff';
        ctx.font = (14 + t * 10) + 'px sans-serif';
        ctx.fillText('✨', e.x - 8, e.y - t * 20);
        ctx.globalAlpha = 1;
      }
      continue;
    }
    if (e.type === 'butterfly') drawButterfly(e.x, e.y, frameCt, e.color);
  }

  // Boss
  if (boss.active) {
    if (!boss.defeated) {
      if (boss.hurtFlash > 0 && boss.hurtFlash % 4 < 2) {
        ctx.globalAlpha = 0.5;
      }
      drawAxolotl(boss.x, boss.y, frameCt, boss.hp, boss.maxHp);
      ctx.globalAlpha = 1;

      // Bubbles
      for (const b of boss.bubbles) {
        drawBubble(b.x, b.y, b.r, frameCt);
      }
    } else {
      // Defeated - happy sitting axolotl
      ctx.save();
      ctx.translate(boss.x, boss.y);
      ctx.globalAlpha = 0.3 + Math.sin(frameCt * 0.05) * 0.15;
      ctx.restore();
      drawAxolotl(boss.x, boss.y + 10, frameCt, boss.maxHp, boss.maxHp);
      // Hearts floating up
      for (let i = 0; i < 3; i++) {
        const hx = boss.x - 15 + i * 15;
        const hy = boss.y - 25 - ((frameCt * 0.8 + i * 40) % 60);
        ctx.globalAlpha = 1 - ((frameCt * 0.8 + i * 40) % 60) / 60;
        ctx.fillStyle = '#ff6b81';
        ctx.font = '12px sans-serif';
        ctx.fillText('💕', hx, hy);
        ctx.globalAlpha = 1;
      }
    }
  }

  // Player
  if (player.alive) {
    drawDalmatian(player.x, player.y, player.dir, frameCt, player.hurtTimer > 0, player.vx, player.vy, player.grounded);
  }

  ctx.restore();
}

// ═══════════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════════
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════
//  EVENT WIRING
// ═══════════════════════════════════════════
document.getElementById('btn-start').addEventListener('click', () => startPhase(0));
document.getElementById('btn-retry').addEventListener('click', () => startPhase(currentPhase));
document.getElementById('btn-next-phase').addEventListener('click', () => {
  if (currentPhase + 1 < PHASES.length) {
    startPhase(currentPhase + 1);
  } else {
    // Completed all phases!
    document.getElementById('win-title').textContent = '🏆 You Win! 🏆';
    document.getElementById('win-msg').textContent =
      'Dotty made friends with everyone! All ' + player.bones + ' bones collected! You are amazing! 🌟';
    document.getElementById('btn-next-phase').textContent = 'Play Again!';
    document.getElementById('screen-win').classList.remove('hidden');
    currentPhase = -1; // reset on next click
  }
});

// Start the loop
loop();
</script>
</body>
